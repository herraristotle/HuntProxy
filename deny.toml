[advisories]
version = 2
yanked = "warn"

ignore = [
  # RUSTSEC-2023-0071: Marvin Attack - timing side-channel in RSA decryption.
  # No patch available as of 2026-10-19. Upstream work in progress:
  # https://github.com/RustCrypto/RSA/issues/626
  # HuntProxy uses rsa for OAST interactsh session registration (ephemeral
  # RSA-2048 keypairs, single decrypt per session). Attacker cannot control
  # ciphertext in our threat model. Risk documented and accepted.
  { id = "RUSTSEC-2023-0071" },

  # RUSTSEC-2026-0036: ctutils Non-constant-time mask generation and `u128` comparisons.
  # Fixed in ctutils 0.4.5; blocked on crypto-bigint 0.7.5 → 0.8 and rsa 0.10 stable.
  # Transitive through crypto-bigint (via rsa). Accepted pending upstream releases.
  { id = "RUSTSEC-2026-0036" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"
